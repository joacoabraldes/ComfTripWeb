<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos y enlaces a las hojas de estilo -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORRELATIVAS ITBA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .header h1 {
            font-size: 2em;
        }

        .correlativas-title {
            cursor: pointer;
            font-size: 1.5em;
            color: #007bff;
            margin-bottom: 20px;
        }

        .correlativas.menu {
            display: block;
        }

        .submenu-title {
            font-size: 1.2em;
            color: #fff;
        }

        .submenu ul {
            list-style: none;
            padding: 0;
        }

        .submenu li {
            margin: 10px 0;
        }

        .submenu a {
            color: #adadad;
            text-decoration: none;
            font-size: 1.1em;
        }

        .submenu a:hover {
            color: #007bff;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    {% include 'navbar.html' %}
      
    <div class="container">
        <div class="header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-o3f/6+8xUzI25q8JfS1s8kzYe2Q7RS3br5z68PAFtfZI938n2b7ZCkXnXQ+tF2K" crossorigin="anonymous"></script>
</body>
</html>
